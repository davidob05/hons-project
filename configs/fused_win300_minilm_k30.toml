[run]
runtag = "fused_w300_k30"
description = "Reciprocal rank fusion of BM25 and all-MiniLM-L6-v2 (may be contaminated) over overlapping 300-word windows (75 overlap), best window per document. Top 30 returned, no gate."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 300
overlap = 75

[s2_score]
impl = "fused"
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"
rrf_k = 60

[s3_tail]
impl = "topk"
k = 30
min_score = -1000.0

[s5_gate]
impl = "toolkit"
