[run]
runtag = "bm25_rr_lbl_mad3"
description = "Reranked as bm25_doc_label_rr, with the Stage 3 MAD gate (c = 3, last 60 daily top cross-encoder scores, 30-day warm-up). Scores are read from the cache of the ungated run, so run that first."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s1_questions]
impl = "template"
template = "{label}: {question}"

[s2_score]
impl = "rerank"
first = "bm25_day"
candidates = 30
model = "cross-encoder/ms-marco-MiniLM-L-12-v2"
device = "cuda"
passage = "lead"
words = 100

[s3_tail]
impl = "mad"
k = 20
c = 3.0
window = 60
warmup = 30

[s5_gate]
impl = "toolkit"
