[run]
runtag = "bm25_doc_narr"
description = "BM25 over each day's whole documents (Terrier, per-day statistics); the topic narrative is appended to each question. Top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s1_questions]
impl = "template"
template = "{question} {narrative}"

[s2_score]
impl = "bm25_day"

[s3_tail]
impl = "topk"
k = 20
min_score = 0.0

[s5_gate]
impl = "toolkit"
