[run]
runtag = "frr_sum_q95"
description = "Fused BM25 and all-MiniLM-L6-v2 (may be contaminated) over overlapping 300-word windows (75 overlap), top 20 reranked by cross-encoder MiniLM-L12 (may be contaminated) with the question prefixed by the topic label, score = cross-encoder logit + the fused z-score sum, Stage 3 quantile gate q = 0.95."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 300
overlap = 75

[s2_score]
impl = "rerank"
first = "fused"
candidates = 20
model = "cross-encoder/ms-marco-MiniLM-L-12-v2"
device = "cuda"
passage = "lead"
words = 100
template = "{label}: {question}"
blend = "sum"
blend_weight = 1.0

[s2_score.first_params]
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"
fusion = "zsum"

[s3_tail]
impl = "quantile"
k = 20
q = 0.95
window = 60
warmup = 30

[s5_gate]
impl = "toolkit"
