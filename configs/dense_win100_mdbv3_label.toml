[run]
runtag = "dense_w100_mdb_lbl"
description = "Dense scoring of overlapping 100-word windows (25 overlap) with msmarco-distilbert-base-v3; the topic label is prepended to each question before scoring. Top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 100
overlap = 25

[s1_questions]
impl = "template"
template = "{label}: {question}"

[s2_score]
impl = "dense"
model = "sentence-transformers/msmarco-distilbert-base-v3"
device = "cuda"

[s3_tail]
impl = "topk"
k = 20
min_score = -1.0

[s5_gate]
impl = "toolkit"
