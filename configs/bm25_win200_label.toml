[run]
runtag = "bm25_win200_lbl"
description = "BM25 over overlapping 200-word windows (50 overlap); the topic label is prepended to each question as the query. Top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 200
overlap = 50

[s1_questions]
impl = "template"
template = "{label}: {question}"

[s2_score]
impl = "bm25_day"

[s3_tail]
impl = "topk"
k = 20
min_score = 0.0

[s5_gate]
impl = "toolkit"
