[run]
runtag = "dense_win75_mdbv3"
description = "Dense scoring of overlapping 75-word windows (18-word overlap) with msmarco-distilbert-base-v3, best window per document, top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 75
overlap = 18

[s2_score]
impl = "dense"
model = "sentence-transformers/msmarco-distilbert-base-v3"
device = "cuda"

[s3_tail]
impl = "topk"
k = 20
min_score = -1.0

[s5_gate]
impl = "toolkit"
