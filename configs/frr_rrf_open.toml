[run]
runtag = "frr_rrf_open"
description = "Fused BM25 and all-MiniLM-L6-v2 (may be contaminated) over overlapping 300-word windows (75 overlap), top 20 reranked by cross-encoder MiniLM-L12 (may be contaminated) with the question prefixed by the topic label, blended with the fused rank by reciprocal rank fusion, no gate."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 300
overlap = 75

[s2_score]
impl = "rerank"
first = "fused"
candidates = 20
model = "cross-encoder/ms-marco-MiniLM-L-12-v2"
device = "cuda"
passage = "lead"
words = 100
template = "{label}: {question}"
blend = "rrf"
blend_k = 60

[s2_score.first_params]
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"
fusion = "rrf"

[s3_tail]
impl = "topk"
k = 20
min_score = -1000.0

[s5_gate]
impl = "toolkit"
