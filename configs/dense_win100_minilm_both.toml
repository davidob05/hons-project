[run]
runtag = "mlm_w100_both"
description = "Dense MiniLM (may be contaminated) over 100-word windows with the topic label prepended and the narrative appended to each question. Top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 100
overlap = 25

[s1_questions]
impl = "template"
template = "{label}: {question} {narrative}"

[s2_score]
impl = "dense"
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"

[s3_tail]
impl = "topk"
k = 20
min_score = -1.0

[s5_gate]
impl = "toolkit"
