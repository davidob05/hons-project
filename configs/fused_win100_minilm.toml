[run]
runtag = "fused_w100_mlm"
description = "Reciprocal rank fusion of BM25 and all-MiniLM-L6-v2 (may be contaminated) over overlapping 100-word windows (25 overlap), best window per document. Top 20 returned, no gate."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 100
overlap = 25

[s2_score]
impl = "fused"
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"
rrf_k = 60

[s3_tail]
impl = "topk"
k = 20
min_score = -1000.0

[s5_gate]
impl = "toolkit"
