[run]
runtag = "bm25_rr_lbl_tm6"
description = "Reranked as bm25_doc_label_rr, with a fixed cross-encoder threshold: only documents scoring above -6.0 (raw logit) are returned, up to 20. Scores are read from the cache of the ungated run, so run that first."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s1_questions]
impl = "template"
template = "{label}: {question}"

[s2_score]
impl = "rerank"
first = "bm25_day"
candidates = 30
model = "cross-encoder/ms-marco-MiniLM-L-12-v2"
device = "cuda"
passage = "lead"
words = 100

[s3_tail]
impl = "topk"
k = 20
min_score = -6.0

[s5_gate]
impl = "toolkit"
