[run]
runtag = "t_bm25_open"
description = "Whole-document BM25 (Terrier, per-day statistics) with the topic label prepended and the narrative appended to each question picks the top 20 and orders them by BM25 score, no gate, all 20 returned with their scores. Official test topics."
topics = "/mnt/primary/cdet/test-data/cd2026-test-topics.jsonl"
mode = "replay"

[s1_questions]
impl = "template"
template = "{label}: {question} {narrative}"

[s2_score]
impl = "bm25_day"

[s3_tail]
impl = "topk"
k = 20
min_score = -1000.0

[s5_gate]
impl = "toolkit"
