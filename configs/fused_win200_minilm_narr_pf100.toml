[run]
runtag = "fused_w200_nar_pf100"
description = "As fused_win200_minilm_narr, but only the union of each question's BM25 top 100 goes to the dense scorer."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 200
overlap = 50

[s1_questions]
impl = "template"
template = "{question} {narrative}"

[s2_score]
impl = "fused"
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"
rrf_k = 60
prefilter = 100

[s3_tail]
impl = "topk"
k = 20
min_score = -1000.0

[s5_gate]
impl = "toolkit"
