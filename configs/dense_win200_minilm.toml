[run]
runtag = "dense_win200_mlm"
description = "Dense scoring of overlapping 200-word windows (50-word overlap) with all-MiniLM-L6-v2 (released around the 2021-08 cutoff, may be contaminated), best window per document, top 20 returned."
topics = "data/dev-topics.jsonl"
mode = "replay"

[s0_fragment]
impl = "windows"
size = 200
overlap = 50

[s2_score]
impl = "dense"
model = "sentence-transformers/all-MiniLM-L6-v2"
device = "cuda"

[s3_tail]
impl = "topk"
k = 20
min_score = -1.0

[s5_gate]
impl = "toolkit"
